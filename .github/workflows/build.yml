name: Build OFXR Bridge Tray Direct

on:
  push:
    branches: [ main, master, berylius-arm-and-exit-lifecycle ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile OFXRBridgeTray with MSVC
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "build/Release"

          # 1. Compiler les ressources Win32 (.rc -> .res)
          Write-Host "Compilation des ressources Win32..."
          rc.exe /fo build/Release/resource.res src/tray/resources.rc
          if ($LASTEXITCODE -ne 0) {
            throw "La compilation des ressources Win32 a échoué ($LASTEXITCODE)."
          }

          # 2. Compiler et linker OFXRBridgeTray.exe
          # Les headers publics du projet sont dans include/.
          Write-Host "Compilation de OFXRBridgeTray.exe..."
          cl.exe /nologo /O2 /std:c++20 /EHsc /utf-8 `
            /I "src" `
            /I "include" `
            /D "NDEBUG" `
            /D "NOMINMAX" `
            /D "UNICODE" `
            /D "_UNICODE" `
            /D "XRFG_IMPLEMENTATION_VERSION=773" `
            /D "XRFG_IMPLEMENTATION_PATCH=0" `
            src/tray/main.cpp `
            build/Release/resource.res `
            /Fe:build/Release/OFXRBridgeTray.exe `
            /link /SUBSYSTEM:WINDOWS `
            user32.lib shell32.lib comctl32.lib advapi32.lib ole32.lib shlwapi.lib

          if ($LASTEXITCODE -ne 0) {
            throw "La compilation de OFXRBridgeTray.exe a échoué ($LASTEXITCODE)."
          }
          if (-not (Test-Path "build/Release/OFXRBridgeTray.exe")) {
            throw "OFXRBridgeTray.exe n'a pas été généré."
          }

      - name: Upload Patched Tray Binary
        uses: actions/upload-artifact@v4
        with:
          name: OFXRBridgeTray-patched
          path: build/Release/OFXRBridgeTray.exe

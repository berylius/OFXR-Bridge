name: Build OFXR Bridge Tray

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake (Tray only)
        shell: pwsh
        run: |
          # Configuration minimale sans exiger les dépendances autonomes
          cmake -B build -G "Visual Studio 17 2022" -A x64 -DXRFG_BUILD_RENDERER=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build Tray Executable
        shell: pwsh
        run: |
          cmake --build build --config Release --target OFXRBridgeTray

      - name: Upload Tray Binary
        uses: actions/upload-artifact@v4
        with:
          name: OFXRBridgeTray-patched
          path: build/Release/OFXRBridgeTray.exe

name: Build OFXR Bridge Tray

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake (Tray only)
        shell: pwsh
        run: |
          # Utilisation de Ninja avec l'environnement MSVC activé
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DXRFG_BUILD_RENDERER=OFF

      - name: Build Tray Executable
        shell: pwsh
        run: |
          cmake --build build --config Release --target OFXRBridgeTray

      - name: Upload Tray Binary
        uses: actions/upload-artifact@v4
        with:
          name: OFXRBridgeTray-patched
          # Avec Ninja en mode Release, l'exécutable est généré directement dans build/ (ou build/bin/),
          # on utilise un pattern pour le capturer où qu'il soit :
          path: |
            build/OFXRBridgeTray.exe
            build/Release/OFXRBridgeTray.exe
            build/bin/OFXRBridgeTray.exe

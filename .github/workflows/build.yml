name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build autonomous route
        shell: pwsh
        run: .\Build-Autonomous.ps1 -TestRoute new

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ofxr-autonomous-new
          path: builds/ofxr-autonomous-new/Release/
          if-no-files-found: error
